<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title"><title id="title">Briefwerk: less guessing, more context. Synthetic feature illustration, not a screenshot.</title><metadata>Original Briefwerk artwork, 2026-10-26. Created with OpenClaw assistance from new vector geometry; CC0-1.0. No upstream logo assets.</metadata><rect width="1440" height="900" rx="28" fill="#f5f1e9"/><g transform="translate(58 42) scale(.52)"><path fill="#14555b" fill-rule="evenodd" d="M30 18H62C81 18 91 28 91 43C91 52 87 59 80 63C91 67 98 75 98 88C98 105 85 114 64 114H30Z M48 36H64L72 44V56H48Z M48 73H68L77 82V96H48Z"/><path d="M73 18H85V30Z" fill="#bf6847"/><text x="128" y="88" fill="#14555b" font-family="DejaVu Sans" font-weight="700" font-size="66" letter-spacing="-3">Briefwerk</text></g><text x="1378" y="88" text-anchor="end" font-family="DejaVu Sans" font-size="14" letter-spacing="2" fill="#566b6a">INDEPENDENT CONVEY DOWNSTREAM</text><text x="68" y="208" fill="#123e44" font-family="DejaVu Sans" font-size="60" font-weight="700" letter-spacing="-2">Less guessing.</text><text x="68" y="282" fill="#123e44" font-family="DejaVu Sans" font-size="60" font-weight="700" letter-spacing="-2">More context.</text><text x="68" y="337" fill="#526568" font-family="DejaVu Sans" font-size="21">The little details that make mail feel clearer.</text><rect x="68" y="385" width="370" height="432" rx="20" fill="#123e44"/><text x="98" y="432" fill="#a3dbd1" font-family="DejaVu Sans" font-size="13" letter-spacing="2">CLOSE AT HAND</text><text x="98" y="487" fill="#f5f1e9" font-family="DejaVu Sans" font-size="17" font-weight="700">01   Know the recipient</text><text x="98" y="515" fill="#bbd1cd" font-family="DejaVu Sans" font-size="13">Identity badges from cached To/Cc</text><text x="98" y="578" fill="#f5f1e9" font-family="DejaVu Sans" font-size="17" font-weight="700">02   Recognise the sender</text><text x="98" y="606" fill="#bbd1cd" font-family="DejaVu Sans" font-size="13">Local contact photos or initials</text><text x="98" y="669" fill="#f5f1e9" font-family="DejaVu Sans" font-size="17" font-weight="700">03   See the exact moment</text><text x="98" y="697" fill="#bbd1cd" font-family="DejaVu Sans" font-size="13">Received date, down to the second</text><text x="98" y="760" fill="#f5f1e9" font-family="DejaVu Sans" font-size="17" font-weight="700">04   Catch what just arrived</text><text x="98" y="788" fill="#bbd1cd" font-family="DejaVu Sans" font-size="13">A session-new tray, not unread history</text><rect x="480" y="385" width="892" height="272" rx="20" fill="#fffdf8" stroke="#d2d8cf"/><circle cx="534" cy="447" r="24" fill="#d8e8df"/><text x="534" y="454" text-anchor="middle" font-family="DejaVu Sans" font-weight="700" font-size="18" fill="#14555b">AK</text><text x="576" y="442" fill="#163e44" font-family="DejaVu Sans" font-size="22" font-weight="700">Alex Kim</text><text x="576" y="470" fill="#60716f" font-family="DejaVu Sans" font-size="16">alex@example.org</text><rect x="1112" y="420" width="216" height="33" rx="8" fill="#dcece4"/><text x="1220" y="442" text-anchor="middle" fill="#14555b" font-family="DejaVu Sans" font-size="13">to: studio@example.org</text><text x="514" y="532" fill="#163e44" font-family="DejaVu Sans" font-size="24" font-weight="700">A quieter inbox, together</text><text x="514" y="570" fill="#60716f" font-family="DejaVu Sans" font-size="18">The updated notes are ready for a look.</text><line x1="514" y1="596" x2="1334" y2="596" stroke="#e0e4db"/><text x="514" y="629" fill="#60716f" font-family="DejaVu Sans" font-size="14">RECEIVED</text><text x="1334" y="629" text-anchor="end" fill="#14555b" font-family="DejaVu Sans" font-size="16">26 Oct 2026 · 14:32:08</text><rect x="480" y="683" width="892" height="134" rx="20" fill="#e0e9e1"/><rect x="506" y="708" width="46" height="46" rx="13" fill="#14555b"/><text x="529" y="739" text-anchor="middle" fill="#fffdf8" font-family="DejaVu Sans" font-size="23" font-weight="700">2</text><text x="575" y="725" fill="#163e44" font-family="DejaVu Sans" font-size="18" font-weight="700">New this session</text><text x="575" y="753" fill="#526568" font-family="DejaVu Sans" font-size="15">Alex Kim — A quieter inbox, together</text><text x="575" y="781" fill="#526568" font-family="DejaVu Sans" font-size="15">Sam Rivera — Tomorrow’s plan</text><text x="1372" y="861" text-anchor="end" fill="#526568" font-family="DejaVu Sans" font-size="13">CONCEPT ILLUSTRATION · SYNTHETIC DATA · NOT AN APP SCREENSHOT</text></svg>
