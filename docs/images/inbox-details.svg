<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title"><title id="title">Griabuntu Mail synthetic feature concept: native desktop intent, pastel teal and peach, not an app screenshot</title><metadata>Original Griabuntu Mail vector artwork, 2026-10-26. OpenClaw-assisted new geometric paths and shapes; CC0-1.0. No third-party logos. Private working identity; name permission/clearance pending.</metadata><rect width="1440" height="960" rx="32" fill="#f3f6ef"/><g transform="translate(54 40) scale(.55)"><path d="M45 14H82V34H46Q34 34 34 46V82Q34 94 46 94H80Q94 94 94 80V77H66V59H114V81Q114 114 81 114H45Q14 114 14 83V45Q14 14 45 14Z" fill="#174e55"/><path d="M88 14L114 40H97Q88 40 88 31Z" fill="#cb947b"/><text x="148" y="84" fill="#174e55" font-family="DejaVu Sans" font-size="62" font-weight="700" letter-spacing="-2.5">Griabuntu<tspan dx="20" font-weight="400" letter-spacing="-2">Mail</tspan></text></g><rect x="1084" y="60" width="294" height="38" rx="19" fill="#e4eee5"/><text x="1231" y="85" fill="#45615f" text-anchor="middle" font-family="DejaVu Sans" font-size="12" letter-spacing="1">INDEPENDENT CONVEY DOWNSTREAM</text><text x="64" y="215" fill="#173f47" font-family="DejaVu Sans" font-size="68" font-weight="700" letter-spacing="-3">Your inbox.</text><text x="64" y="294" fill="#173f47" font-family="DejaVu Sans" font-size="68" font-weight="700" letter-spacing="-3">A little more at home.</text><text x="66" y="348" fill="#4f6966" font-family="DejaVu Sans" font-size="22">Clearer details. Softer surfaces. Native desktop intent.</text><rect x="64" y="400" width="380" height="440" rx="28" fill="#cfe5db"/><text x="96" y="449" fill="#355d59" font-family="DejaVu Sans" font-size="13" letter-spacing="2">THE DETAILS, CLOSE AT HAND</text><text x="96" y="505" fill="#173f47" font-family="DejaVu Sans" font-size="19" font-weight="700">01   Who received it</text><text x="96" y="535" fill="#3f625e" font-family="DejaVu Sans" font-size="14">Badges for your configured aliases</text><text x="96" y="599" fill="#173f47" font-family="DejaVu Sans" font-size="19" font-weight="700">02   Who sent it</text><text x="96" y="629" fill="#3f625e" font-family="DejaVu Sans" font-size="14">Local photos, or simple initials</text><text x="96" y="693" fill="#173f47" font-family="DejaVu Sans" font-size="19" font-weight="700">03   When it arrived</text><text x="96" y="723" fill="#3f625e" font-family="DejaVu Sans" font-size="14">Received time, down to the second</text><text x="96" y="787" fill="#173f47" font-family="DejaVu Sans" font-size="19" font-weight="700">04   What is new</text><text x="96" y="817" fill="#3f625e" font-family="DejaVu Sans" font-size="14">A tray for arrivals in this session</text><rect x="476" y="400" width="902" height="276" rx="28" fill="#fffdf7" stroke="#d3ded3" stroke-width="1.5"/><circle cx="535" cy="466" r="27" fill="#f2ddce"/><text x="535" y="474" text-anchor="middle" fill="#744a3c" font-family="DejaVu Sans" font-size="21" font-weight="700">AK</text><text x="582" y="456" fill="#173f47" font-family="DejaVu Sans" font-size="23" font-weight="700">Alex Kim</text><text x="582" y="486" fill="#526965" font-family="DejaVu Sans" font-size="17">alex@example.org</text><rect x="1104" y="434" width="238" height="38" rx="19" fill="#e4eee5"/><text x="1223" y="459" text-anchor="middle" fill="#355d59" font-family="DejaVu Sans" font-size="14">to: studio@example.org</text><text x="510" y="550" fill="#173f47" font-family="DejaVu Sans" font-size="26" font-weight="700">A quieter inbox, together</text><text x="510" y="591" fill="#526965" font-family="DejaVu Sans" font-size="18">The updated notes are ready for a look.</text><line x1="510" y1="618" x2="1344" y2="618" stroke="#e0e6da"/><text x="510" y="650" fill="#526965" font-family="DejaVu Sans" font-size="13" letter-spacing="1">RECEIVED</text><text x="1344" y="650" text-anchor="end" fill="#174e55" font-family="DejaVu Sans" font-size="16">26 Oct 2026 · 14:32:08</text><rect x="476" y="700" width="902" height="140" rx="28" fill="#e4eee5"/><rect x="508" y="731" width="52" height="52" rx="17" fill="#174e55"/><text x="534" y="766" text-anchor="middle" fill="#f3f6ef" font-family="DejaVu Sans" font-size="27" font-weight="700">2</text><text x="585" y="739" fill="#173f47" font-family="DejaVu Sans" font-size="19" font-weight="700">New this session</text><text x="585" y="770" fill="#46635e" font-family="DejaVu Sans" font-size="16">Alex Kim — A quieter inbox, together</text><text x="585" y="800" fill="#46635e" font-family="DejaVu Sans" font-size="16">Sam Rivera — Tomorrow’s plan</text><text x="64" y="899" fill="#526965" font-family="DejaVu Sans" font-size="13">DESIGN DIRECTION, NOT A COMPLETED APP REDESIGN</text><text x="1378" y="899" text-anchor="end" fill="#526965" font-family="DejaVu Sans" font-size="13">SYNTHETIC CONCEPT · NOT A SCREENSHOT</text></svg>
